<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotated Sorted Array Search</title>
<style>
  body{margin:0;background:#15151f;color:#eee;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .desc{color:#aaa;margin:0 0 16px}
  #stage{background:#1d1d2a;border:1px solid #333;border-radius:10px}
  svg{width:100%;height:auto;display:block}
  .narration{min-height:24px;margin:12px 0;color:#cfcfe0}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:#2b2b3a;color:#eee;border:1px solid #555;border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:#e0b341}
  .counter{margin-left:auto;color:#888}
  .quiz{margin-top:16px;background:#1d1d2a;border:1px solid #3a3a4a;border-radius:10px;padding:14px}
  .quiz .q{font-weight:600;margin-bottom:8px}
  .quiz button{margin:4px 6px 4px 0}
  .reveal{margin-top:10px;color:#cfcfe0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Search in Rotated Sorted Array</h1>
  <p class="desc">Closed interval [lo, hi]. Each step: (1) mid == target? (2) which side is sorted — arr[lo] &lt;= arr[mid]? (3) is target inside that side's value range? yes → go there, no → go the other way. Green bar = the sorted side.</p>
  <div id="stage"><svg id="svg" viewBox="0 0 640 360"></svg></div>
  <div class="narration" id="narration">—</div>
  <div class="controls">
    <button id="prev">◀ Prev</button>
    <button id="play">▶ Play</button>
    <button id="step">Step ▶|</button>
    <button id="reset">⟲ Reset</button>
    <label>Speed <input id="speed" type="range" min="300" max="1600" value="1200"></label>
    <span class="counter" id="counter"></span>
  </div>
  <div class="quiz" id="quiz" hidden>
    <div class="q" id="qtext"></div>
    <div id="qopts"></div>
    <div class="reveal" id="reveal" hidden></div>
  </div>
</div>
<script>
const SVG="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(SVG,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function clear(){while(svg.firstChild)svg.removeChild(svg.firstChild);}
function txt(x,y,s,o){const t=el('text',Object.assign({x,y,'text-anchor':'middle',fill:'#fff','font-size':14},o||{}));t.textContent=s;svg.appendChild(t);}

// s: {values, target, lo, hi, mid, found, title, code, bug}
function drawBS(s){
  clear();
  const n=s.values.length,bw=46,gap=6,bh=44,total=n*bw+(n-1)*gap,x0=(640-total)/2,y0=150;
  txt(320,34,s.title,{'font-size':15,'font-weight':700,fill:s.bug?'#f87171':'#e0b341'});
  txt(320,58,'target = '+s.target,{fill:'#cfcfe0','font-size':13});
  // room bracket
  if(s.lo<=s.hi){
    const xa=x0+s.lo*(bw+gap)-4, xb=x0+s.hi*(bw+gap)+bw+4;
    svg.appendChild(el('rect',{x:xa,y:y0-6,width:xb-xa,height:bh+12,rx:10,fill:'rgba(59,130,246,0.10)',stroke:'#3b82f6','stroke-width':1.5,'stroke-dasharray':'5,4'}));
    txt((xa+xb)/2,y0-32,'interval ['+s.lo+', '+s.hi+']  ('+(s.hi-s.lo+1)+' left)',{fill:'#7fb0ff','font-size':12});
  } else {
    txt(320,y0+bh+30,'interval EMPTY (lo > hi)',{fill:'#f87171','font-size':12});
  }
  if(s.sorted){const [a,b]=s.sorted, xa=x0+a*(bw+gap), xb=x0+b*(bw+gap)+bw;
    svg.appendChild(el('rect',{x:xa,y:y0+bh+8,width:xb-xa,height:5,rx:2,fill:'#3fb950'}));
    txt((xa+xb)/2,y0+bh+44,'sorted: values '+s.values[a]+' … '+s.values[b],{fill:'#3fb950','font-size':12});}
  s.values.forEach((v,i)=>{
    const x=x0+i*(bw+gap), inRoom=i>=s.lo&&i<=s.hi, isMid=i===s.mid, isFound=s.found===i;
    const fill=isFound?'#2ea043':(isMid?'#e0b341':(inRoom?'#2b2b3a':'#191922'));
    const stroke=isFound?'#3fb950':(isMid?'#ffd75e':(inRoom?'#666':'#2a2a33'));
    svg.appendChild(el('rect',{x,y:y0,width:bw,height:bh,rx:6,fill,stroke,'stroke-width':2}));
    txt(x+bw/2,y0+bh/2+5,v,{fill:inRoom||isMid||isFound?(isMid&&!isFound?'#15151f':'#fff'):'#555','font-weight':isMid?700:400});
    txt(x+bw/2,y0-14,i,{fill:'#777','font-size':11});
    const names=[];
    if(i===s.lo)names.push('lo'); if(i===s.hi)names.push('hi'); if(i===s.mid)names.push('mid');
    names.forEach((nm,k)=>txt(x+bw/2,y0+bh+64+k*16,'↑ '+nm,{fill:nm==='mid'?'#e0b341':'#7fb0ff','font-size':12}));
  });
  if(s.code){txt(320,330,s.code,{fill:'#b8b8c8','font-size':13,'font-family':'Menlo,monospace'});}
}

const narration=document.getElementById('narration'),counter=document.getElementById('counter');
const quiz=document.getElementById('quiz'),qtext=document.getElementById('qtext'),qopts=document.getElementById('qopts'),reveal=document.getElementById('reveal');
const playBtn=document.getElementById('play'),speed=document.getElementById('speed');
let STEPS=[],idx=0,timer=null;
function render(){const s=STEPS[idx];s.draw();narration.textContent=s.note||'';counter.textContent=(idx+1)+' / '+STEPS.length;
  if(s.question)showQuestion(s.question);else quiz.hidden=true;}
function showQuestion(q){quiz.hidden=false;qtext.textContent=q.prompt;reveal.hidden=true;qopts.innerHTML='';
  q.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;
    b.onclick=()=>{reveal.hidden=false;reveal.textContent=(i===q.answer?'✓ Correct. ':'✗ Not quite. ')+q.explain;};qopts.appendChild(b);});}
function step(){if(idx<STEPS.length-1){idx++;render();}else pause();}
function prev(){if(idx>0){idx--;render();}}
function pause(){clearInterval(timer);timer=null;playBtn.textContent='▶ Play';}
function play(){if(timer){pause();return;}playBtn.textContent='⏸ Pause';timer=setInterval(()=>{if(idx>=STEPS.length-1){pause();return;}step();},+speed.value);}
function reset(){pause();idx=0;render();}
document.getElementById('prev').onclick=prev;
document.getElementById('step').onclick=()=>{pause();step();};
document.getElementById('reset').onclick=reset;
playBtn.onclick=play;

function buildSteps(){
  const A=[4,5,6,7,0,1,2], T=0, P1='Part 1 — LC 33: find 0 in [4,5,6,7,0,1,2]';
  const B=[2,3,4,5,6,7,0,1], P2='Part 2 — why one end is not enough (target 7)';
  const S=(o)=>()=>drawBS(o);
  return [
    {draw:S({values:A,target:T,lo:0,hi:6,mid:null,title:P1,code:'lo, hi = 0, 6'}),
     note:'Sorted, then cut and swapped. One break: between 7 and 0. Closed interval [0, 6].'},
    {draw:S({values:A,target:T,lo:0,hi:6,mid:3,title:P1,code:'mid = 3 → arr[3] = 7 ≠ 0'}),
     note:'Step 1: mid = 3, value 7. Not the target.'},
    {draw:S({values:A,target:T,lo:0,hi:6,mid:3,sorted:[0,3],title:P1,code:'arr[lo] = 4 <= arr[mid] = 7  →  left side sorted'}),
     note:'Step 2: which side is sorted? arr[lo] <= arr[mid] (4 <= 7) → [lo..mid] has no break.',
     question:{prompt:'Left side spans values 4 … 7. Target is 0. Where next?',options:['Left — 0 < 4 so it goes before','Right — 0 is not in [4, 7)','Return -1'],answer:1,
       explain:'Test the range: 4 <= 0 < 7 is false, so 0 cannot be on the sorted left side. It must be on the right (or nowhere).'}},
    {draw:S({values:A,target:T,lo:4,hi:6,mid:null,title:P1,code:'not (4 <= 0 < 7)  →  lo = mid + 1 = 4'}),
     note:'Step 3: target outside the sorted range → go the other way. Interval [4, 6].'},
    {draw:S({values:A,target:T,lo:4,hi:6,mid:5,title:P1,code:'mid = 5 → arr[5] = 1 ≠ 0'}),
     note:'mid = 5, value 1. Not the target.'},
    {draw:S({values:A,target:T,lo:4,hi:6,mid:5,sorted:[4,5],title:P1,code:'arr[lo] = 0 <= arr[mid] = 1  →  left sorted;  0 <= 0 < 1 ✓'}),
     note:'Left [4..5] sorted, spans 0 … 1. Is 0 in [0, 1)? Yes → go left: hi = mid - 1 = 4.'},
    {draw:S({values:A,target:T,lo:4,hi:4,mid:4,found:4,title:P1,code:'mid = 4 → arr[4] == 0 → return 4'}),
     note:'Found at 4. Three steps, still O(log n).'},
    {draw:S({values:B,target:7,lo:0,hi:7,mid:3,sorted:[0,3],title:P2,bug:true,code:'mid = 3 → 5;  arr[lo] = 2 <= 5 → left sorted'}),
     note:'Your pre-test rule: "arr[lo] < target → go left". Left is sorted and spans 2 … 5.',
     question:{prompt:'arr[lo] = 2 < 7. Is 7 on the left side?',options:['Yes — 7 > arr[lo]','No — 7 is above the left side\'s max (5)'],answer:1,
       explain:'The left side only holds values 2 … 5. Checking only the low end (2 < 7) misses that 7 is past the high end. You need both: arr[lo] <= target < arr[mid].'}},
    {draw:S({values:B,target:7,lo:0,hi:7,mid:3,found:5,sorted:[0,3],title:P2,bug:true,code:'one-end rule → go left → never finds index 5'}),
     note:'7 is at index 5, on the right. A one-end check sends you left and returns -1. Two ends: 2 <= 7 < 5 is false → go right ✓.'}
  ];
}
STEPS=buildSteps();render();
</script>
</body>
</html>
