<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Half-Open Binary Search</title>
<style>
  body{margin:0;background:#15151f;color:#eee;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .desc{color:#aaa;margin:0 0 16px}
  #stage{background:#1d1d2a;border:1px solid #333;border-radius:10px}
  svg{width:100%;height:auto;display:block}
  .narration{min-height:24px;margin:12px 0;color:#cfcfe0}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:#2b2b3a;color:#eee;border:1px solid #555;border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:#e0b341}
  .counter{margin-left:auto;color:#888}
  .quiz{margin-top:16px;background:#1d1d2a;border:1px solid #3a3a4a;border-radius:10px;padding:14px}
  .quiz .q{font-weight:600;margin-bottom:8px}
  .quiz button{margin:4px 6px 4px 0}
  .reveal{margin-top:10px;color:#cfcfe0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Half-Open Binary Search — [lo, hi)</h1>
  <p class="desc">Same algorithm, half-open interval [lo, hi): lo included, hi excluded. New interval keeps the same brackets: [mid + 1, hi) or [lo, mid). Part 2 shows what happens when you mix the two styles.</p>
  <div id="stage"><svg id="svg" viewBox="0 0 640 360"></svg></div>
  <div class="narration" id="narration">—</div>
  <div class="controls">
    <button id="prev">◀ Prev</button>
    <button id="play">▶ Play</button>
    <button id="step">Step ▶|</button>
    <button id="reset">⟲ Reset</button>
    <label>Speed <input id="speed" type="range" min="300" max="1600" value="1200"></label>
    <span class="counter" id="counter"></span>
  </div>
  <div class="quiz" id="quiz" hidden>
    <div class="q" id="qtext"></div>
    <div id="qopts"></div>
    <div class="reveal" id="reveal" hidden></div>
  </div>
</div>
<script>
const SVG="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(SVG,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function clear(){while(svg.firstChild)svg.removeChild(svg.firstChild);}
function txt(x,y,s,o){const t=el('text',Object.assign({x,y,'text-anchor':'middle',fill:'#fff','font-size':14},o||{}));t.textContent=s;svg.appendChild(t);}

// s: {values, target, lo, hi, mid, found, title, code, bug}   room = [lo, hi)  (hi excluded)
function drawBS(s){
  clear();
  const n=s.values.length,bw=46,gap=6,bh=44,cells=n+1,total=cells*bw+(cells-1)*gap,x0=(640-total)/2,y0=150;
  txt(320,34,s.title,{'font-size':15,'font-weight':700,fill:s.bug?'#f87171':'#e0b341'});
  txt(320,58,'target = '+s.target+'    interval [lo, hi)  — lo included, hi excluded',{fill:'#cfcfe0','font-size':13});
  if(s.lo<s.hi){
    const xa=x0+s.lo*(bw+gap)-4, xb=x0+(s.hi-1)*(bw+gap)+bw+4;
    svg.appendChild(el('rect',{x:xa,y:y0-6,width:xb-xa,height:bh+12,rx:10,fill:'rgba(59,130,246,0.10)',stroke:'#3b82f6','stroke-width':1.5,'stroke-dasharray':'5,4'}));
    txt((xa+xb)/2,y0+bh+30,'interval ['+s.lo+', '+s.hi+')  ('+(s.hi-s.lo)+' left)',{fill:'#7fb0ff','font-size':12});
  } else {
    txt(320,y0+bh+30,'interval EMPTY (lo == hi)',{fill:'#f87171','font-size':12});
  }
  for(let i=0;i<cells;i++){
    const x=x0+i*(bw+gap), ghost=i===n, v=ghost?'':s.values[i];
    const inRoom=i>=s.lo&&i<s.hi, isMid=i===s.mid, isFound=s.found===i, isDoor=i===s.hi;
    let fill=isFound?'#2ea043':(isMid?'#e0b341':(inRoom?'#2b2b3a':'#191922'));
    let stroke=isFound?'#3fb950':(isMid?'#ffd75e':(inRoom?'#666':'#2a2a33'));
    const a={x,y:y0,width:bw,height:bh,rx:6,fill,stroke,'stroke-width':2};
    if(ghost){a.fill='none';a.stroke='#444';a['stroke-dasharray']='4,3';}
    if(isDoor){a.stroke='#f87171';a['stroke-width']=3;}
    svg.appendChild(el('rect',a));
    txt(x+bw/2,y0+bh/2+5,v,{fill:inRoom||isMid||isFound?(isMid&&!isFound?'#15151f':'#fff'):'#555','font-weight':isMid?700:400});
    txt(x+bw/2,y0-14,ghost?i+' (past end)':i,{fill:'#777','font-size':11});
    const names=[];
    if(i===s.lo)names.push('lo'); if(isDoor)names.push('hi (excl)'); if(isMid)names.push('mid');
    names.forEach((nm,k)=>txt(x+bw/2,y0+bh+56+k*16,'↑ '+nm,{fill:nm==='mid'?'#e0b341':(nm==='lo'?'#7fb0ff':'#f87171'),'font-size':12}));
  }
  if(s.code){txt(320,330,s.code,{fill:'#b8b8c8','font-size':13,'font-family':'Menlo,monospace'});}
}

const narration=document.getElementById('narration'),counter=document.getElementById('counter');
const quiz=document.getElementById('quiz'),qtext=document.getElementById('qtext'),qopts=document.getElementById('qopts'),reveal=document.getElementById('reveal');
const playBtn=document.getElementById('play'),speed=document.getElementById('speed');
let STEPS=[],idx=0,timer=null;
function render(){const s=STEPS[idx];s.draw();narration.textContent=s.note||'';counter.textContent=(idx+1)+' / '+STEPS.length;
  if(s.question)showQuestion(s.question);else quiz.hidden=true;}
function showQuestion(q){quiz.hidden=false;qtext.textContent=q.prompt;reveal.hidden=true;qopts.innerHTML='';
  q.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;
    b.onclick=()=>{reveal.hidden=false;reveal.textContent=(i===q.answer?'✓ Correct. ':'✗ Not quite. ')+q.explain;};qopts.appendChild(b);});}
function step(){if(idx<STEPS.length-1){idx++;render();}else pause();}
function prev(){if(idx>0){idx--;render();}}
function pause(){clearInterval(timer);timer=null;playBtn.textContent='▶ Play';}
function play(){if(timer){pause();return;}playBtn.textContent='⏸ Pause';timer=setInterval(()=>{if(idx>=STEPS.length-1){pause();return;}step();},+speed.value);}
function reset(){pause();idx=0;render();}
document.getElementById('prev').onclick=prev;
document.getElementById('step').onclick=()=>{pause();step();};
document.getElementById('reset').onclick=reset;
playBtn.onclick=play;

function buildSteps(){
  const A=[2,5,8,12,16,23,38,56,72,91], T=12, P1='Part 1 — half-open search on [lo, hi)';
  const B=[1,3], P2='Part 2 — bug: hi = mid - 1 with exclusive hi', P3='Part 3 — fix: hi = mid';
  const S=(o)=>()=>drawBS(o);
  return [
    {draw:S({values:A,target:T,lo:0,hi:10,mid:null,title:P1,code:'lo, hi = 0, len(arr)   # [0, n)'}),
     note:'hi = 10 is not a valid index — it is the excluded end. [0, 10) = indices 0..9, size hi - lo = 10.'},
    {draw:S({values:A,target:T,lo:0,hi:10,mid:5,title:P1,code:'while lo < hi:   mid = (0 + 10) // 2 = 5'}),
     note:'lo < hi → non-empty. mid = 5, arr[5] = 23 > 12. Too big.',
     question:{prompt:'23 > 12. hi is exclusive. Where does hi go?',options:['hi = 4 (mid - 1)','hi = 5 (mid)','hi = 6 (mid + 1)'],answer:1,
       explain:'mid was checked and ruled out, so the new interval is [lo, mid) → hi = mid. Index 4 is still unchecked and must stay in.'}},
    {draw:S({values:A,target:T,lo:0,hi:5,mid:null,title:P1,code:'arr[mid] > target  →  hi = mid = 5   # [lo, mid)'}),
     note:'New interval [lo, mid) = [0, 5): indices 0..4. 5 is the excluded end.'},
    {draw:S({values:A,target:T,lo:0,hi:5,mid:2,title:P1,code:'mid = (0 + 5) // 2 = 2'}),
     note:'mid = 2, arr[2] = 8 < 12. Too small.'},
    {draw:S({values:A,target:T,lo:3,hi:5,mid:null,title:P1,code:'arr[mid] < target  →  lo = mid + 1 = 3   # [mid + 1, hi)'}),
     note:'lo is inclusive, so the new interval is [mid + 1, hi) = [3, 5) — same as the closed version.'},
    {draw:S({values:A,target:T,lo:3,hi:5,mid:4,title:P1,code:'mid = (3 + 5) // 2 = 4   →   16 > 12   →   hi = 4'}),
     note:'mid = 4, arr[4] = 16 > 12. New interval [3, 4): hi = 4.'},
    {draw:S({values:A,target:T,lo:3,hi:4,mid:3,title:P1,code:'mid = (3 + 4) // 2 = 3'}),
     note:'Interval [3, 4): size 1. lo < hi still true (3 < 4) — non-empty.'},
    {draw:S({values:A,target:T,lo:3,hi:4,mid:3,found:3,title:P1,code:'arr[mid] == target  →  return 3'}),
     note:'Found at 3.'},
    {draw:S({values:B,target:1,lo:0,hi:2,mid:null,title:P2,bug:true,code:'lo, hi = 0, 2'}),
     note:'Now the bug from your pre-test. [1, 3], target 1, half-open setup, but hi = mid - 1 out of habit.'},
    {draw:S({values:B,target:1,lo:0,hi:2,mid:1,title:P2,bug:true,code:'mid = (0 + 2) // 2 = 1   →   3 > 1'}),
     note:'mid = 1, arr[1] = 3 > 1. The buggy line runs: hi = mid - 1 = 0.',
     question:{prompt:'hi becomes 0. What is the interval [0, 0)?',options:['Index 0 only','Empty','Indices 0 and 1'],answer:1,
       explain:'[0, 0) is empty — hi = 0 excludes index 0. The loop exits and returns -1, but 1 is sitting at index 0, never checked.'}},
    {draw:S({values:B,target:1,lo:0,hi:0,mid:null,title:P2,bug:true,code:'lo < hi  →  0 < 0 false  →  return -1   ✗ WRONG'}),
     note:'Wrong answer. hi = mid - 1 with exclusive hi gives [lo, mid - 1), which drops mid AND mid - 1 — one unchecked element lost.'},
    {draw:S({values:B,target:1,lo:0,hi:1,mid:0,found:0,title:P3,code:'hi = mid = 1  →  interval [0,1)  →  mid = 0  →  return 0'}),
     note:'With hi = mid, the interval is [0, 1) — index 0 stays in. Found. Same brackets in, same brackets out.'}
  ];
}
STEPS=buildSteps();render();
</script>
</body>
</html>
